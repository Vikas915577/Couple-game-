name: Deploy YaarJam V2 Offline

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js for source validation
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate frontend-only app
        run: |
          set -eu
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s sw.js
          test -s manifest.json
          test -s assets/icon.svg
          node --check app.js
          node --check sw.js
          node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8'))"
          node tests-smoke.cjs

      - name: Prepare static Pages artifact
        run: |
          set -eu
          rm -rf _site
          mkdir -p _site/assets
          cp index.html styles.css app.js sw.js manifest.json _site/
          cp assets/icon.svg _site/assets/icon.svg

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
