name: Build and deploy YaarJam

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore the expected src folder structure
        run: |
          set -eu
          mkdir -p src/lib
          cp App.tsx src/App.tsx
          cp main.tsx src/main.tsx
          cp styles.css src/styles.css
          cp catalog.ts src/catalog.ts
          cp catalog.test.ts src/catalog.test.ts
          cp vite-env.d.ts src/vite-env.d.ts
          cp supabase.ts src/lib/supabase.ts
          cp rooms.ts src/lib/rooms.ts
          cp tic-tac-toe.ts src/lib/tic-tac-toe.ts
          cp tic-tac-toe-online.ts src/lib/tic-tac-toe-online.ts
          cp tic-tac-toe.test.ts src/lib/tic-tac-toe.test.ts
          cp truth-or-dare.ts src/lib/truth-or-dare.ts
          cp truth-or-dare-online.ts src/lib/truth-or-dare-online.ts
          cp truth-or-dare.test.ts src/lib/truth-or-dare.test.ts
          cp truth-or-dare-online.test.ts src/lib/truth-or-dare-online.test.ts
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run unit tests
        run: npm test
      - name: Build production website
        run: npm run build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
